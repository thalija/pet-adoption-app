# Render Blueprint: deploys the Django API and the React site as two free services.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  # ---------- Django REST API ----------
  - type: web
    runtime: python
    name: pet-adoption-api
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Free instances have no persistent disk, so the demo uses SQLite and
    # re-creates the sample data every time the service starts.
    startCommand: python manage.py init_local_db --reset && gunicorn config.wsgi --bind 0.0.0.0:$PORT --access-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Public demo: the admin dashboard is view-only
      - key: DEMO_READ_ONLY
        value: "True"
      - key: ADMIN_SECRET_KEY
        generateValue: true
      # Accept the React site's Render URL (pet-adoption-app or pet-adoption-app-<suffix>)
      - key: DJANGO_CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://pet-adoption-app(-[a-z0-9]+)?\.onrender\.com$
      # Optional extra exact origins, e.g. a custom domain (no trailing slash)
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false

  # ---------- React frontend ----------
  - type: web
    runtime: static
    name: pet-adoption-app
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      # URL of the API service, e.g. https://pet-adoption-api.onrender.com (no trailing slash)
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # Let React Router handle every path (e.g. /user, /pets/3)
      - type: rewrite
        source: /*
        destination: /index.html
